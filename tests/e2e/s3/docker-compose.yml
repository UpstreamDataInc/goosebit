services:
  s3:
    image: ghcr.io/getmoto/motoserver:5.2.3@sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c
    ports:
      - "9000:9000"
    environment:
      - MOTO_PORT=9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/moto-api/"]
      interval: 3s
      timeout: 5s
      retries: 3
  goosebit:
    build:
      context: ../../..
      dockerfile: tests/e2e/docker/goosebit/Dockerfile
    ports:
      - "60053:60053"
    environment:
      - GOOSEBIT_DATABASE_URL=sqlite:///app/db/db.sqlite3
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:60053"]
      interval: 3s
      timeout: 5s
      retries: 3
  swupdate:
    build:
      context: ../docker/swupdate
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      goosebit:
        condition: service_healthy
