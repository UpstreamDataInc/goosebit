minimum_pre_commit_version: "4.7.0"
default_language_version:
  node: system # Reuse Node provided by pre-commit.ci to stay below its build size limit
ci:
  skip:
    - poetry-lock
    - pytest
repos:
  - repo: https://github.com/python-poetry/poetry
    rev: 2.5.1
    hooks:
      - id: poetry-check
      - id: poetry-lock
      - id: poetry-install
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        name: check-yaml for mkdocs.yml
        files: ^mkdocs\.yml$
        args: [--unsafe]
      - id: check-yaml
        name: check-yaml for other YAML files
        exclude: ^mkdocs\.yml$
      - id: check-added-large-files
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 10.0.0b2
    hooks:
      - id: isort
        name: isort (python)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies:
          [
            anyio==4.11.0,
            fastapi==0.117.1,
            joserfc==1.3.4,
            pydantic==2.13.4,
            pydantic-settings==2.14.2,
            pytest-asyncio==1.4.0,
            types-pyyaml==6.0.12.20250915,
          ]
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: env poetry run pytest tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0 # You can specify the version of Flake8 you want to use
    hooks:
      - id: flake8
        additional_dependencies: []
  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.6.4"
    hooks:
      - id: biome-check
        exclude: \.(md|ya?ml)$ # Formatted by Prettier
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.9.10"
    hooks:
      - id: prettier
        files: \.(html|md|yml|yaml)$
  - repo: https://github.com/djlint/djLint
    rev: v1.49.3
    hooks:
      - id: djlint-reformat-jinja
      - id: djlint-jinja
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
